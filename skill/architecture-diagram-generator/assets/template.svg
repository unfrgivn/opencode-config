<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" width="100%" height="auto" role="img" aria-labelledby="title desc">
  <title id="title">Clean architecture diagram template</title>
  <desc id="desc">A sparse responsive SVG architecture diagram with dashed zones, pastel nodes, and simple arrows.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#53616f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>

    <style><![CDATA[
      .diagram-bg { fill: #fffdf8; }
      .zone { fill-opacity: .42; stroke-width: 2.5; stroke-dasharray: 9 9; }
      .node { stroke-width: 2.5; }
      .title { font: 700 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #273342; }
      .label { font: 700 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #273342; }
      .note { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #53616f; }
      .edge { fill: none; stroke: #53616f; stroke-width: 2.4; marker-end: url(#arrow); }
      .edge-muted { fill: none; stroke: #8a96a3; stroke-width: 2; marker-end: url(#arrow); }
    ]]></style>
  </defs>

  <rect class="diagram-bg" width="1440" height="760" rx="24" />

  <!-- Zone: triggers -->
  <rect class="zone" x="60" y="100" width="250" height="330" rx="22" fill="#FFF0DB" stroke="#B86B3D" />
  <text class="title" x="82" y="135">Triggers</text>

  <rect class="node" x="92" y="168" width="186" height="54" rx="12" fill="#FFE4BC" stroke="#B86B3D" />
  <text class="label" x="185" y="202" text-anchor="middle">Slack</text>

  <rect class="node" x="92" y="250" width="186" height="54" rx="12" fill="#FFE4BC" stroke="#B86B3D" />
  <text class="label" x="185" y="284" text-anchor="middle">Webhook</text>

  <rect class="node" x="92" y="332" width="186" height="54" rx="12" fill="#FFE4BC" stroke="#B86B3D" />
  <text class="label" x="185" y="366" text-anchor="middle">Schedule</text>

  <!-- API -->
  <rect class="node" x="390" y="205" width="170" height="180" rx="24" fill="#FFF3BF" stroke="#A66B1F" />
  <text class="label" x="475" y="302" text-anchor="middle">/dispatch</text>

  <!-- Zone: sandbox -->
  <rect class="zone" x="650" y="75" width="560" height="510" rx="26" fill="#EAF4FF" stroke="#3659A8" />
  <text class="title" x="675" y="112">Sandbox</text>
  <text class="note" x="930" y="138">Pre-warmed snapshot</text>
  <text class="note" x="930" y="160">repos + tools ready</text>

  <rect class="node" x="720" y="155" width="190" height="58" rx="12" fill="#4F7FE5" stroke="#2751A8" />
  <text class="label" x="815" y="191" text-anchor="middle" fill="#fff">Task Queue</text>

  <rect class="node" x="805" y="270" width="300" height="120" rx="26" fill="#DCD4FF" stroke="#6D36C6" />
  <text class="title" x="955" y="338" text-anchor="middle">OpenCode Agent</text>

  <rect class="node" x="805" y="455" width="300" height="66" rx="14" fill="#4F7FE5" stroke="#2751A8" />
  <text class="label" x="955" y="496" text-anchor="middle" fill="#fff">Credential Proxy</text>

  <!-- Zone: external services -->
  <rect class="zone" x="1280" y="100" width="120" height="420" rx="22" fill="#EFFBF3" stroke="#2E7D61" />
  <text class="title" x="1300" y="135">External</text>

  <rect class="node" x="1300" y="170" width="80" height="48" rx="10" fill="#B9F1D0" stroke="#2E7D61" />
  <text class="note" x="1340" y="200" text-anchor="middle">GitHub</text>

  <rect class="node" x="1300" y="246" width="80" height="48" rx="10" fill="#B9F1D0" stroke="#2E7D61" />
  <text class="note" x="1340" y="276" text-anchor="middle">Slack</text>

  <rect class="node" x="1300" y="322" width="80" height="48" rx="10" fill="#B9F1D0" stroke="#2E7D61" />
  <text class="note" x="1340" y="352" text-anchor="middle">Linear</text>

  <!-- Flow arrows -->
  <path class="edge" d="M278 195 C322 195 342 230 390 250" />
  <path class="edge" d="M278 277 C320 277 345 286 390 292" />
  <path class="edge" d="M278 359 C322 359 342 332 390 328" />
  <path class="edge" d="M560 295 C610 250 655 210 720 185" />
  <path class="edge-muted" d="M910 184 C950 205 955 235 955 270" />
  <path class="edge" d="M955 390 L955 455" />
  <path class="edge" d="M1105 488 C1180 455 1225 395 1300 346" />
  <text class="note" x="1182" y="435" transform="rotate(-25 1182 435)">API calls</text>
</svg>
