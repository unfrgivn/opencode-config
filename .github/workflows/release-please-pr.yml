name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      # Dispatch publish-npm.yml as a separate workflow_dispatch event rather
      # than calling it via workflow_call. npm trusted publishing only allows
      # a single workflow filename and validates the OIDC token's workflow_ref
      # claim. With workflow_call that claim points to the *caller* workflow,
      # which doesn't match the trusted publisher config on npmjs.org.
      # Dispatching ensures publish-npm.yml is always the top-level workflow
      # so the OIDC claim matches.
      - name: Trigger publish workflow
        if: ${{ steps.release.outputs.releases_created == 'true' && steps.release.outputs.tag_name != '' }}
        run: gh workflow run publish-npm.yml --repo "${{ github.repository }}" --ref "${{ steps.release.outputs.tag_name }}" --field "ref=${{ steps.release.outputs.tag_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
